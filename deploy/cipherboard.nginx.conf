# /etc/nginx/sites-available/cipherboard  (replace BOARD_DOMAIN)
limit_req_zone $binary_remote_addr zone=cipherboard:10m rate=10r/s;

server {
    listen 80;
    server_name BOARD_DOMAIN;

    location / {
        limit_req zone=cipherboard burst=20 nodelay;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append (prevents rate-limit spoofing)
    }
}
